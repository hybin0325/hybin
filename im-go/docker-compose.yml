services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_PARTITIONS=64
      - REDIS_ADDR=redis:6379
      - GATEWAY_PORT=8080
    ports:
      - "8080:8080"

  fanout-worker-0:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_PARTITIONS=64
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=2
      - WORKER_ID=0

  fanout-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_PARTITIONS=64
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=2
      - WORKER_ID=1
